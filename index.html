<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Not Too Sweet Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <img src="images/logoTransparent.png" alt="Not Too Sweet logo" class="navbar-logo">
    <ul class="nav-links">
      <li><a href="index.html">Menu</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="order.html">Place Order</a></li>
    </ul>
  </nav>

  <h1>a Not Too <Samp></Samp>Sweet menu</h1>
  <div id="filters"></div>
  <div id="menu"></div>

  <div id="item-modal" class="modal-overlay hidden">
    <div class="modal">
      <button type="button" id="modal-close-btn" class="modal-close" aria-label="Close">&times;</button>
      <div class="modal-image-wrap">
        <button type="button" id="modal-prev-btn" class="modal-arrow modal-arrow-prev hidden" aria-label="Previous photo">&#10094;</button>
        <img id="modal-img" src="" alt="">
        <button type="button" id="modal-next-btn" class="modal-arrow modal-arrow-next hidden" aria-label="Next photo">&#10095;</button>
      </div>
      <h2 id="modal-name"></h2>
      <p id="modal-price"></p>
      <p id="modal-description"></p>
      <p id="modal-batch-size"></p>
      <button type="button" id="modal-add-btn" class="button-link">Add to Cart</button>
    </div>
  </div>

  <script src="menu.js"></script>
</body>
</html>
